<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Selector</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); }
        input, button { padding: 12px; margin: 10px; width: 80%; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); border: none; cursor: pointer; font-weight: bold; }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>

    <input type="date" id="birthday" required>
    <button id="submitBtn">Подтвердить</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const submitBtn = document.getElementById('submitBtn');
        const birthdayInput = document.getElementById('birthday');

        submitBtn.onclick = async () => {
            const birthday = birthdayInput.value;
            if (!birthday) {
                alert('Пожалуйста, выберите дату');
                return;
            }

            // Получаем ID пользователя из Telegram или из URL (для тестов в браузере)
            const urlParams = new URLSearchParams(window.location.search);
            const userId = tg.initDataUnsafe?.user?.id || urlParams.get('user_id');

            if (!userId) {
                alert('Ошибка: ID пользователя не найден. Добавьте ?user_id=123 в адресную строку для теста.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            try {
                const response = await fetch('https://hook.eu1.make.com/xw1aqtrt9csn5tz8cqvberuek8baf8v9', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        birthday: birthday
                    })
                });

                if (response.ok) {
                    // Если запрос прошел, закрываем WebApp
                    tg.close();
                } else {
                    alert('Ошибка сервера Make. Статус: ' + response.status);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Подтвердить';
                }
            } catch (error) {
                alert('Сетевая ошибка или CORS. Убедитесь, что сценарий в Make запущен.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Подтвердить';
            }
        };
    </script>
</body>
</html>
