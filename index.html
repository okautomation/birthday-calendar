<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вибір дати</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        input, button { padding: 12px; margin: 10px; width: 80%; border-radius: 8px; font-size: 16px; }
        button { background-color: #2481cc; color: white; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <input type="date" id="birthday">
    <button id="submitBtn">Підтвердити</button>

    <script>
        const tg = window.Telegram.WebApp;
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.onclick = async () => {
            const date = document.getElementById('birthday').value;
            if (!date) return alert('Оберіть дату!');

            const urlParams = new URLSearchParams(window.location.search);
            const userId = tg.initDataUnsafe?.user?.id || urlParams.get('user_id');

            if (!userId) return alert('Помилка: Немає ID користувача!');

            submitBtn.disabled = true;
            submitBtn.innerText = 'Відправка...';

            try {
                await fetch('https://hook.eu1.make.com/j69tayh47d2lkkrv6aj2hvkaj0ws2gj1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, birthday: date })
                });
                alert('Готово!');
                tg.close();
            } catch (e) {
                alert('Помилка мережі!');
                submitBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
