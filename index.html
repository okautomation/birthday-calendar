<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дата народження</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#f0ede8;padding:20px}
.card{background:#16213e;border:1px solid #0f3460;border-radius:20px;padding:40px 36px;width:100%;max-width:420px}
.icon{font-size:40px;margin-bottom:20px}
h1{font-size:26px;font-weight:400;margin-bottom:8px}
.sub{color:#8892b0;font-size:14px;margin-bottom:32px;line-height:1.5}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8892b0;margin-bottom:8px}
.field{margin-bottom:20px}
.date-row{display:flex;gap:10px}
.date-col{flex:1;display:flex;flex-direction:column;align-items:center}
.date-col select{
  width:100%;
  background:#0d1b2a;
  border:1.5px solid #0f3460;
  border-radius:10px;
  color:#f0ede8;
  font-size:15px;
  padding:12px 4px;
  outline:none;
  cursor:pointer;
}
.date-col select:focus{border-color:#e94560}
.date-col-label{font-size:11px;color:#4a5568;margin-top:5px}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#e94560,#c23152);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity .2s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:#e94560;font-size:13px;margin-top:12px;display:none;text-align:center}
.ok{display:none;text-align:center;padding:10px 0}
.ok-icon{font-size:50px;margin-bottom:16px}
.ok h2{font-size:24px;font-weight:400;margin-bottom:8px}
.ok p{color:#8892b0;font-size:14px;line-height:1.6}
.ok-date{margin-top:20px;padding:14px;background:#e9456015;border:1px solid #e9456040;border-radius:10px;color:#e94560;font-size:17px}
.spin{display:none;width:20px;height:20px;border:2px solid #fff4;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;margin:0 auto}
@keyframes s{to{transform:rotate(360deg)}}
.divider{height:1px;background:#0f3460;margin:24px 0}
.hint{margin-top:16px;text-align:center;color:#4a5568;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div id="form">
    <div class="icon">🎂</div>
    <h1>Дата народження</h1>
    <p class="sub">Вкажіть вашу дату народження — отримаєте привітання в Telegram</p>
    <div class="field">
      <label>Дата народження</label>
      <div class="date-row">
        <div class="date-col">
          <select id="sel-day">
            <option value="">—</option>
          </select>
          <span class="date-col-label">день</span>
        </div>
        <div class="date-col">
          <select id="sel-month">
            <option value="">—</option>
            <option value="01">Січень</option>
            <option value="02">Лютий</option>
            <option value="03">Березень</option>
            <option value="04">Квітень</option>
            <option value="05">Травень</option>
            <option value="06">Червень</option>
            <option value="07">Липень</option>
            <option value="08">Серпень</option>
            <option value="09">Вересень</option>
            <option value="10">Жовтень</option>
            <option value="11">Листопад</option>
            <option value="12">Грудень</option>
          </select>
          <span class="date-col-label">місяць</span>
        </div>
        <div class="date-col">
          <select id="sel-year">
            <option value="">—</option>
          </select>
          <span class="date-col-label">рік</span>
        </div>
      </div>
    </div>
    <div class="divider"></div>
    <button class="btn" id="btn" onclick="send()">
      <span id="bt">Зберегти дату →</span>
      <div class="spin" id="sp"></div>
   </button>
    <div class="err" id="err"></div>
    <div class="hint">🔒 Дані зберігаються безпечно</div>
  </div>
  <div class="ok" id="ok">
    <div class="ok-icon">🎉</div>
    <h2>Готово!</h2>
    <p>Дату народження збережено.<br>Ви отримаєте привітання в Telegram!</p>
    <div class="ok-date" id="od"></div>
  </div>
</div>
<script>
var mn={'01':'січня','02':'лютого','03':'березня','04':'квітня','05':'травня','06':'червня','07':'липня','08':'серпня','09':'вересня','10':'жовтня','11':'листопада','12':'грудня'};

// Fill days
var selDay=document.getElementById('sel-day');
for(var d=1;d<=31;d++){
  var o=document.createElement('option');
  o.value=String(d).padStart(2,'0');
  o.textContent=d;
  selDay.appendChild(o);
}

// Fill years
var selYear=document.getElementById('sel-year');
var curYear=new Date().getFullYear();
for(var y=curYear-5;y>=1930;y--){
  var oy=document.createElement('option');
  oy.value=String(y);
  oy.textContent=y;
  selYear.appendChild(oy);
}

function getChatId(){
  var p=new URLSearchParams(window.location.search);
  return p.get('chat_id')p.get('user_id')'';
}

async function send(){
  var day=document.getElementById('sel-day').value;
  var month=document.getElementById('sel-month').value;
  var year=document.getElementById('sel-year').value;
  var e=document.getElementById('err');
  if(!day!month!year){
    e.style.display='block';
    e.textContent='⚠️ Оберіть день, місяць і рік';
    return;
  }
  e.style.display='none';
  var birthday=day+'.'+month+'.'+year;
  var btn=document.getElementById('btn'),bt=document.getElementById('bt'),sp=document.getElementById('sp');
  btn.disabled=true;bt.style.display='none';sp.style.display='block';
  try{
    await fetch('https://hook.eu1.make.com/j69tayh47d2lkkrv6aj2hvkaj0ws2gj1',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        birthday:birthday,
        day:day,
        month:month,
        year:year,
        chat_id:getChatId(),
        timestamp:new Date().toISOString()
      })
    });
    document.getElementById('form').style.display='none';
    document.getElementById('ok').style.display='block';
    document.getElementById('od').textContent=parseInt(day)+' '+mn[month]+' '+year;
    if(window.Telegram&&window.Telegram.WebApp){
      setTimeout(function(){window.Telegram.WebApp.close();},2000);
    }
  }catch(err){
    btn.disabled=false;bt.style.display='block';sp.style.display='none';
    e.textContent='⚠️ Помилка. Спробуйте ще раз.';
    e.style.display='block';
  }
}
</script>
</body>
</html>
