<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дата народження</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#f0ede8;padding:20px}
.card{background:#16213e;border:1px solid #0f3460;border-radius:20px;padding:40px 36px;width:100%;max-width:420px}
.icon{font-size:40px;margin-bottom:20px}
h1{font-size:26px;font-weight:400;margin-bottom:8px}
.sub{color:#8892b0;font-size:14px;margin-bottom:32px;line-height:1.5}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8892b0;margin-bottom:8px}
.field{margin-bottom:20px}
.date-row{display:flex;gap:10px}
.date-col{flex:1;display:flex;flex-direction:column;align-items:center}
.date-col select{width:100%;background:#0d1b2a;border:1.5px solid #0f3460;border-radius:10px;color:#f0ede8;font-size:15px;padding:12px 4px;outline:none;cursor:pointer}
.date-col-label{font-size:11px;color:#4a5568;margin-top:5px}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#e94560,#c23152);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.4}
.err{color:#e94560;font-size:13px;margin-top:12px;display:none;text-align:center}
.ok{display:none;text-align:center;padding:10px 0}
.ok-icon{font-size:50px;margin-bottom:16px}
.ok h2{font-size:24px;font-weight:400;margin-bottom:8px}
.ok p{color:#8892b0;font-size:14px;line-height:1.6}
.ok-date{margin-top:20px;padding:14px;background:#e9456015;border:1px solid #e9456040;border-radius:10px;color:#e94560;font-size:17px}
.divider{height:1px;background:#0f3460;margin:24px 0}
.hint{margin-top:16px;text-align:center;color:#4a5568;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div id="form">
    <div class="icon">🎂</div>
    <h1>Дата народження</h1>
    <p class="sub">Вкажіть вашу дату народження — отримаєте привітання в Telegram</p>
    <div class="field">
      <label>Дата народження</label>
      <div class="date-row">
        <div class="date-col">
          <select id="sel-day">
            <option value="">—</option>
            <option value="01">1</option><option value="02">2</option><option value="03">3</option>
            <option value="04">4</option><option value="05">5</option><option value="06">6</option>
            <option value="07">7</option><option value="08">8</option><option value="09">9</option>
            <option value="10">10</option><option value="11">11</option><option value="12">12</option>
            <option value="13">13</option><option value="14">14</option><option value="15">15</option>
            <option value="16">16</option><option value="17">17</option><option value="18">18</option>
            <option value="19">19</option><option value="20">20</option><option value="21">21</option>
            <option value="22">22</option><option value="23">23</option><option value="24">24</option>
            <option value="25">25</option><option value="26">26</option><option value="27">27</option>
            <option value="28">28</option><option value="29">29</option><option value="30">30</option>
            <option value="31">31</option>
          </select>
          <span class="date-col-label">день</span>
        </div>
        <div class="date-col">
          <select id="sel-month">
            <option value="">—</option>
            <option value="01">Січень</option><option value="02">Лютий</option>
            <option value="03">Березень</option><option value="04">Квітень</option>
            <option value="05">Травень</option><option value="06">Червень</option>
            <option value="07">Липень</option><option value="08">Серпень</option>
            <option value="09">Вересень</option><option value="10">Жовтень</option>
            <option value="11">Листопад</option><option value="12">Грудень</option>
          </select>
          <span class="date-col-label">місяць</span>
        </div>
        <div class="date-col">
          <select id="sel-year">
            <option value="">—</option>
            <option value="2010">2010</option><option value="2009">2009</option>
            <option value="2008">2008</option><option value="2007">2007</option>
            <option value="2006">2006</option><option value="2005">2005</option>
            <option value="2004">2004</option><option value="2003">2003</option>
            <option value="2002">2002</option><option value="2001">2001</option>
            <option value="2000">2000</option><option value="1999">1999</option>
            <option value="1998">1998</option><option value="1997">1997</option>
            <option value="1996">1996</option><option value="1995">1995</option>
            <option value="1994">1994</option><option value="1993">1993</option>
            <option value="1992">1992</option><option value="1991">1991</option>
            <option value="1990">1990</option><option value="1989">1989</option>
            <option value="1988">1988</option><option value="1987">1987</option>
            <option value="1986">1986</option><option value="1985">1985</option>
            <option value="1984">1984</option><option value="1983">1983</option>
            <option value="1982">1982</option><option value="1981">1981</option>
            <option value="1980">1980</option><option value="1979">1979</option>
            <option value="1978">1978</option><option value="1977">1977</option>
            <option value="1976">1976</option><option value="1975">1975</option>
            <option value="1974">1974</option><option value="1973">1973</option>
            <option value="1972">1972</option><option value="1971">1971</option>
            <option value="1970">1970</option><option value="1969">1969</option>
            <option value="1968">1968</option><option value="1967">1967</option>
            <option value="1966">1966</option><option value="1965">1965</option>
            <option value="1964">1964</option><option value="1963">1963</option>
            <option value="1962">1962</option><option value="1961">1961</option>
            <option value="1960">1960</option><option value="1959">1959</option>
            <option value="1958">1958</option><option value="1957">1957</option>
            <option value="1956">1956</option><option value="1955">1955</option>
            <option value="1954">1954</option><option value="1953">1953</option>
            <option value="1952">1952</option><option value="1951">1951</option>
            <option value="1950">1950</option>
          </select>
          <span class="date-col-label">рік</span>
        </div>
      </div>
    </div>
    <div class="divider"></div>
    <button class="btn" id="btn" onclick="send()">Зберегти дату →</button>
    <div class="err" id="err"></div>
    <div class="hint">🔒 Дані зберігаються безпечно</div>
  </div>
  <div class="ok" id="ok">
    <div class="ok-icon">🎉</div>
    <h2>Готово!</h2>
    <p>Дату народження збережено.<br>Ви отримаєте привітання в Telegram!</p>
    <div class="ok-date" id="od"></div>
  </div>
</div>
<script>
var mn={'01':'січня','02':'лютого','03':'березня','04':'квітня','05':'травня','06':'червня','07':'липня','08':'серпня','09':'вересня','10':'жовтня','11':'листопада','12':'грудня'};

function getChatId(){
  var p=new URLSearchParams(window.location.search);
  return p.get('chat_id')  p.get('user_id')  '';
}

function send(){
  var day=document.getElementById('sel-day').value;
  var month=document.getElementById('sel-month').value;
  var year=document.getElementById('sel-year').value;
  var e=document.getElementById('err');
  if(!day!month!year){
    e.style.display='block';
    e.textContent='⚠️ Оберіть день, місяць і рік';
    return;
  }
  e.style.display='none';
  document.getElementById('btn').disabled=true;

  var xhr=new XMLHttpRequest();
  xhr.open('POST','https://hook.eu1.make.com/j69tayh47d2lkkrv6aj2hvkaj0ws2gj1',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      document.getElementById('form').style.display='none';
      document.getElementById('ok').style.display='block';
      document.getElementById('od').textContent=parseInt(day)+' '+mn[month]+' '+year;
      if(window.Telegram&&window.Telegram.WebApp){
        setTimeout(function(){window.Telegram.WebApp.close();},2000);
      }
    }
  };
  xhr.send(JSON.stringify({
    birthday:day+'.'+month+'.'+year,
    day:day,month:month,year:year,
    chat_id:getChatId(),
    timestamp:new Date().toISOString()
  }));
}
</script>
</body>
</html>
