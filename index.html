<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Selector</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); }
        input, button { padding: 12px; margin: 10px; width: 80%; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); border: none; cursor: pointer; font-weight: bold; }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>

    <input type="date" id="birthday" required>
    <button id="submitBtn">Подтвердить</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        const userId = tg?.initDataUnsafe?.user?.id;

if (!userId) {
  alert("Открой приложение внутри Telegram.");
    return;
}
        const webhookUrl = 'https://hook.eu1.make.com/xw1aqtrt9csn5tz8cqvberuek8baf8v9';

        const submitBtn = document.getElementById('submitBtn');
        const birthdayInput = document.getElementById('birthday');

        submitBtn.onclick = async () => {
            const birthday = birthdayInput.value;

            if (!birthday) {
                alert('Пожалуйста, выберите дату');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        birthday: birthday
                    })
                });

                if (response.ok) {
                    // Закрываем WebApp после успешной отправки
                    tg.close();
                } else {
                    alert('Ошибка при отправке данных');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Подтвердить';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Сетевая ошибка');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Подтвердить';
            }
        };
    </script>
</body>
</html>
