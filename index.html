<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Selector</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); }
        input, button { padding: 12px; margin: 10px; width: 80%; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); border: none; cursor: pointer; font-weight: bold; }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>

    <input type="date" id="birthday" required>
    <button id="submitBtn">Подтвердить</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        // Ваш новый URL Make
        const webhookUrl = 'https://hook.us1.make.com/8665573532:AAHpsToW-q-ziIROqup0L3a-jcrwW8ekbIg';

        const submitBtn = document.getElementById('submitBtn');
        const birthdayInput = document.getElementById('birthday');

        submitBtn.onclick = async () => {
            const birthday = birthdayInput.value;

            if (!birthday) {
                alert('Пожалуйста, выберите дату');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        birthday: birthday
                    })
                });

                if (response.ok) {
                    tg.close();
                } else {
                    alert('Ошибка сервера Make. Проверьте сценарий.');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Подтвердить';
                }
            } catch (error) {
                alert('Ошибка сети или CORS');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Подтвердить';
            }
        };
    </script>
</body>
</html>
