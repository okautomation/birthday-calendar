<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вибір дати народження</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #f0f2f5;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 350px;
            text-align: center;
        }
        h2 { color: #333; font-size: 18px; margin-bottom: 20px; }
        input { 
            padding: 12px; 
            margin: 15px 0; 
            width: 100%; 
            border-radius: 8px; 
            border: 1px solid #ddd;
            font-size: 16px; 
            box-sizing: border-box;
        }
        button { 
            background-color: #2481cc; 
            color: white; 
            border: none; 
            padding: 15px; 
            width: 100%; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled { background-color: #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Вкажіть дату народження</h2>
        <input type="date" id="birthday">
        <button id="submitBtn">Підтвердити</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const submitBtn = document.getElementById('submitBtn');

        // Повідомляємо Telegram, що додаток готовий
        tg.ready();
        tg.expand(); // Розгортаємо на весь екран

        submitBtn.onclick = async () => {
            const date = document.getElementById('birthday').value;
            if (!date) {
                alert('Будь ласка, оберіть дату!');
                return;
            }

            // Отримуємо user_id з Telegram або з посилання (для тестів)
            const urlParams = new URLSearchParams(window.location.search);
            const userId = tg.initDataUnsafe?.user?.id || urlParams.get('user_id');

            if (!userId) {
                alert('Помилка: Не вдалося визначити ваш ID. Відкрийте додаток через бот.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Відправка...';

            try {
                // ВАШ НОВИЙ ХУК
                const response = await fetch('https://hook.eu1.make.com/j69tayh47d2lkkrv6aj2hvkaj0ws2gj1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: userId, 
                        birthday: date 
                    })
                });

                if (response.ok) {
                    alert('Дякуємо! Дату збережено.');
                    tg.close(); // Закриваємо міні-додаток
                } else {
                    throw new Error('Помилка сервера');
                }
            } catch (e) {
                alert('Сталася помилка при відправці. Спробуйте ще раз.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Підтвердити';
            }
        };
    </script>
</body>
</html>
